# GitHub "Sponsor" button config for the Causal Seal open standard.
#
# NOTE: GitHub Sponsors / Liberapay / Ko-fi all pay out via Stripe or PayPal,
# neither of which supports receiving in Morocco — so those are omitted.
# Open Collective (pays maintainers via Wise, which can reach Moroccan banks)
# is the one donation rail worth trying; enable it and uncomment below.

# open_collective: causal-seal

# Always-available link to the project (no payment processor needed):
custom: ["https://causalseal.org"]
